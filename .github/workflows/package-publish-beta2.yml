name: NodeRooms Beta2 validation and gated publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attempt publication after every Beta2 release gate is PASS
        required: true
        default: false
        type: boolean
      release_confirmation:
        description: Type PUBLISH 1.3.0-beta.2 only after independent approval
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_VERSION: 1.3.0-beta.2
  RELEASE_SOURCE_PATH: release-source/1.3.0-beta.2
  RELEASE_GATE_PATH: docs/release/1.3.0-beta.2/release-gate.json
  RELEASE_PACKAGE_FILE: mixxyai-noderooms-openclaw-1.3.0-beta.2.tgz
  RELEASE_PACKAGE_SHA256: d4839309193fb66696fdb3fa497b0193ef47a676d6db92f2353057f3fa6b4c5f
  RELEASE_ARTIFACT_NAME: noderooms-clawpack-v1.3.0-beta.2

concurrency:
  group: noderooms-clawhub-1.3.0-beta.2
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build-clawpack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}

      - name: Set up supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$RELEASE_SOURCE_PATH/package.json"
          test -f "$RELEASE_SOURCE_PATH/openclaw.plugin.json"
          test -f "$RELEASE_GATE_PATH"
          cmp "$RELEASE_GATE_PATH" "$RELEASE_SOURCE_PATH/$RELEASE_GATE_PATH"
          node --input-type=commonjs -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const m=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));if(p.name!=="@mixxyai/noderooms-openclaw"||p.version!==process.env.RELEASE_VERSION||m.version!==p.version)process.exit(1);' "$RELEASE_SOURCE_PATH/package.json" "$RELEASE_SOURCE_PATH/openclaw.plugin.json"

      - name: Verify immutable Beta1 predecessor
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/beta1-pack"
          npm pack ./release-source/1.3.0-beta.1 --ignore-scripts --json --pack-destination "$RUNNER_TEMP/beta1-pack" > "$RUNNER_TEMP/beta1-pack.json"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/beta1-pack/mixxyai-noderooms-openclaw-1.3.0-beta.1.tgz" | awk '{print $1}')"
          test "$actual_sha256" = "27f9fa2a5d4f3af9ed5aa984d6c8b260c9298f0292749fa698839c70e256ea27"

      - name: Install exact locked dependencies
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Audit production dependencies
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify PHP test runtime
        run: php -v

      - name: Build and run the complete suite
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        run: |
          npm run build
          npm test
          diff -qr src dist

      - name: Validate the OpenClaw runtime package contract
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        run: npx --yes clawhub@0.23.1 package validate . --runtime --allow-execute --json

      - name: Build and hash-gate the exact package
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./*.tgz
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/npm-pack-output.json"
          test -f "$RELEASE_PACKAGE_FILE"
          actual_sha256="$(sha256sum "$RELEASE_PACKAGE_FILE" | awk '{print $1}')"
          test "$actual_sha256" = "$RELEASE_PACKAGE_SHA256"
          tar -tzf "$RELEASE_PACKAGE_FILE" > "$RUNNER_TEMP/clawpack-files.txt"
          grep -Fqx "package/dist/index.js" "$RUNNER_TEMP/clawpack-files.txt"
          grep -Fqx "package/openclaw.plugin.json" "$RUNNER_TEMP/clawpack-files.txt"
          if grep -Eq '^package/(src|tests|node_modules|release-source)/' "$RUNNER_TEMP/clawpack-files.txt"; then
            exit 1
          fi
          tar -xOf "$RELEASE_PACKAGE_FILE" package/package.json > "$RUNNER_TEMP/clawpack-package.json"
          node --input-type=commonjs -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.name!=="@mixxyai/noderooms-openclaw"||p.version!==process.env.RELEASE_VERSION||p.openclaw?.extensions?.[0]!=="./dist/index.js")process.exit(1);' "$RUNNER_TEMP/clawpack-package.json"

      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ env.RELEASE_SOURCE_PATH }}/${{ env.RELEASE_PACKAGE_FILE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  validate:
    needs: build-clawpack
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      dry_run: true
      version: 1.3.0-beta.2
      tags: beta
      source_path: release-source/1.3.0-beta.2
      package_artifact_name: noderooms-clawpack-v1.3.0-beta.2
      package_artifact_path: mixxyai-noderooms-openclaw-1.3.0-beta.2.tgz
      inspector_artifact_name: noderooms-plugin-inspector-v1.3.0-beta.2-dry-run
      publish_json_artifact_name: noderooms-clawhub-v1.3.0-beta.2-dry-run-json

  publication-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
      - build-clawpack
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}

      - name: Set up supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0

      - name: Enforce independent release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          test "$RELEASE_CONFIRMATION" = "PUBLISH $RELEASE_VERSION"
          node --input-type=commonjs -e 'const fs=require("node:fs");const g=JSON.parse(fs.readFileSync(process.env.RELEASE_GATE_PATH,"utf8"));const blocked=g.gates.filter(x=>x.blocking&&x.status!=="PASS");if(g.schema_version!=="noderooms-release-gate-v1"||g.candidate.version!==process.env.RELEASE_VERSION||g.candidate.package_sha256!==process.env.RELEASE_PACKAGE_SHA256||g.status!=="PASS"||g.publication_allowed!==true||blocked.length)process.exit(1);'

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
      - build-clawpack
      - validate
      - publication-gate
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      dry_run: false
      version: 1.3.0-beta.2
      tags: beta
      source_path: release-source/1.3.0-beta.2
      package_artifact_name: noderooms-clawpack-v1.3.0-beta.2
      package_artifact_path: mixxyai-noderooms-openclaw-1.3.0-beta.2.tgz
      inspector_artifact_name: noderooms-plugin-inspector-v1.3.0-beta.2-publish
      publish_json_artifact_name: noderooms-clawhub-v1.3.0-beta.2-publish-json
