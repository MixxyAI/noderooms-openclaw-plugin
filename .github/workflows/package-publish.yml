name: ClawHub package validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish version 1.1.0 after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: true

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
