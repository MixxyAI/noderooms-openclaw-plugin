name: NodeRooms Beta1 immutable validation (publish disabled)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_VERSION: 1.3.0-beta.1
  RELEASE_SOURCE_PATH: release-source/1.3.0-beta.1
  RELEASE_PACKAGE_FILE: mixxyai-noderooms-openclaw-1.3.0-beta.1.tgz
  RELEASE_PACKAGE_SHA256: 27f9fa2a5d4f3af9ed5aa984d6c8b260c9298f0292749fa698839c70e256ea27
  RELEASE_ARTIFACT_NAME: noderooms-clawpack-v1.3.0-beta.1

concurrency:
  group: noderooms-clawhub-1.3.0-beta.1
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build-clawpack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the verified workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}

      - name: Verify exact trusted source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$RELEASE_SOURCE_PATH/package.json"
          test -f "$RELEASE_SOURCE_PATH/openclaw.plugin.json"
          node --input-type=commonjs -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(value.name!=="@mixxyai/noderooms-openclaw"||value.version!=="1.3.0-beta.1")process.exit(1);' "$RELEASE_SOURCE_PATH/package.json"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0

      - name: Install exact declared dependencies
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Verify PHP test runtime
        run: php -v

      - name: Build and test
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        run: |
          npm run build
          npm test

      - name: Build and hash-gate exact ClawPack
        working-directory: ${{ env.RELEASE_SOURCE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./*.tgz
          npm pack --json > "$RUNNER_TEMP/npm-pack-output.log"
          test -f "$RELEASE_PACKAGE_FILE"
          actual_sha256="$(sha256sum "$RELEASE_PACKAGE_FILE" | awk '{print $1}')"
          echo "Expected SHA-256: $RELEASE_PACKAGE_SHA256"
          echo "Actual SHA-256:   $actual_sha256"
          test "$actual_sha256" = "$RELEASE_PACKAGE_SHA256"
          tar -tzf "$RELEASE_PACKAGE_FILE" > "$RUNNER_TEMP/clawpack-files.txt"
          grep -Fqx "package/dist/index.js" "$RUNNER_TEMP/clawpack-files.txt"
          grep -Fqx "package/openclaw.plugin.json" "$RUNNER_TEMP/clawpack-files.txt"
          tar -xOf "$RELEASE_PACKAGE_FILE" package/package.json > "$RUNNER_TEMP/clawpack-package.json"
          node --input-type=commonjs -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(value.name!=="@mixxyai/noderooms-openclaw"||value.version!=="1.3.0-beta.1"||value.openclaw?.extensions?.[0]!=="./dist/index.js")process.exit(1);' "$RUNNER_TEMP/clawpack-package.json"

      - name: Upload verified ClawPack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ env.RELEASE_SOURCE_PATH }}/${{ env.RELEASE_PACKAGE_FILE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  validate:
    needs: build-clawpack
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      dry_run: true
      version: 1.3.0-beta.1
      tags: beta
      source_path: release-source/1.3.0-beta.1
      package_artifact_name: noderooms-clawpack-v1.3.0-beta.1
      package_artifact_path: mixxyai-noderooms-openclaw-1.3.0-beta.1.tgz
      inspector_artifact_name: noderooms-plugin-inspector-v1.3.0-beta.1-dry-run
      publish_json_artifact_name: noderooms-clawhub-v1.3.0-beta.1-dry-run-json
